<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" shape-rendering="crispEdges">
    <defs>
        <style>
            text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
            .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
            .title { font-weight: 800; letter-spacing: 1.5px; }
            .label { font-weight: 600; letter-spacing: 0.5px; }
        </style>
        <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.03"/>
            <rect x="38" y="38" width="4" height="4" fill="#155DFC" opacity="0.15" transform="rotate(45 40 40)"/>
        </pattern>
    </defs>

    <!-- Background -->
    <rect width="1200" height="675" fill="#1E2227"/>
    <rect width="1200" height="675" fill="url(#techGrid)"/>

    <!-- Background Geometric & Neural Network Elements (Skill Analysis Nodes) -->
    <g stroke="#155DFC" stroke-width="1.5" fill="none" opacity="0.2">
        <!-- Top Left Cluster -->
        <line x1="80" y1="120" x2="160" y2="80"/>
        <line x1="160" y1="80" x2="220" y2="150"/>
        <line x1="80" y1="120" x2="140" y2="200"/>
        <line x1="140" y1="200" x2="220" y2="150"/>
        <line x1="220" y1="150" x2="300" y2="110"/>
        <!-- Diamond Nodes -->
        <rect x="76" y="116" width="8" height="8" fill="#155DFC" transform="rotate(45 80 120)"/>
        <rect x="156" y="76" width="8" height="8" fill="#155DFC" transform="rotate(45 160 80)"/>
        <rect x="216" y="146" width="8" height="8" fill="#155DFC" transform="rotate(45 220 150)"/>
        <rect x="136" y="196" width="8" height="8" fill="#155DFC" transform="rotate(45 140 200)"/>
        <rect x="296" y="106" width="8" height="8" fill="#155DFC" transform="rotate(45 300 110)"/>

        <!-- Bottom Right Cluster -->
        <line x1="950" y1="580" x2="1020" y2="540"/>
        <line x1="1020" y1="540" x2="1100" y2="590"/>
        <line x1="1020" y1="540" x2="1060" y2="480"/>
        <rect x="946" y="576" width="8" height="8" fill="#155DFC" transform="rotate(45 950 580)"/>
        <rect x="1016" y="536" width="8" height="8" fill="#155DFC" transform="rotate(45 1020 540)"/>
        <rect x="1096" y="586" width="8" height="8" fill="#155DFC" transform="rotate(45 1100 590)"/>
        <rect x="1056" y="476" width="8" height="8" fill="#155DFC" transform="rotate(45 1060 480)"/>
    </g>

    <!-- Large Background Hexagons (Corporate Structure Motif) -->
    <g stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.02">
        <polygon points="1050,150 1100,120 1150,150 1150,210 1100,240 1050,210"/>
        <polygon points="100,450 150,420 200,450 200,510 150,540 100,510"/>
    </g>

    <!-- Environment: Desk -->
    <polygon points="60,520 620,520 660,550 20,550" fill="#252A32"/>
    <rect x="20" y="550" width="640" height="12" fill="#1A1E24"/>
    <rect x="100" y="562" width="16" height="113" fill="#15181C"/>
    <rect x="560" y="562" width="16" height="113" fill="#15181C"/>

    <!-- Professional Individual (Sharp Geometric Vector Style) -->
    <g id="employee">
        <!-- Chair Backrest -->
        <polygon points="160,340 220,340 240,520 140,520" fill="#15181C" stroke="#252A32" stroke-width="2"/>

        <!-- Legs -->
        <polygon points="240,520 280,520 300,675 250,675" fill="#0F172A"/>
        <polygon points="290,520 330,520 360,675 310,675" fill="#1E293B"/>

        <!-- Torso / Corporate Suit -->
        <polygon points="210,520 250,330 350,330 380,520" fill="#334155"/>
        <!-- Shirt & Tie -->
        <polygon points="250,330 300,420 350,330" fill="#F8FAFC"/>
        <polygon points="290,330 300,400 310,330" fill="#155DFC"/> <!-- Blue Accent Tie -->
        <!-- Suit Lapels -->
        <polygon points="250,330 280,440 210,520 230,400" fill="#1E293B"/>
        <polygon points="350,330 320,440 380,520 370,400" fill="#1E293B"/>

        <!-- Neck & Head -->
        <rect x="285" y="290" width="24" height="40" fill="#E2E8F0"/>
        <!-- Face (Angled toward screen) -->
        <polygon points="270,230 330,230 345,275 310,305 265,290" fill="#F8FAFC"/>
        <!-- Hair (Sleek, Professional) -->
        <polygon points="260,240 275,205 325,200 350,235 335,250 280,245" fill="#0F172A"/>
        <!-- Sharp Glasses -->
        <polygon points="295,255 325,255 325,270 295,270" fill="none" stroke="#155DFC" stroke-width="2"/>
        <line x1="275" y1="262" x2="295" y2="262" stroke="#155DFC" stroke-width="2"/>

        <!-- Left Arm (Resting on desk) -->
        <polygon points="240,340 200,440 230,490 250,480 225,435 265,350" fill="#1E293B"/>
        <!-- Right Arm (Interacting with laptop) -->
        <polygon points="340,340 410,430 460,480 445,495 390,445 320,360" fill="#334155"/>

        <!-- Hands -->
        <polygon points="220,485 245,485 240,500 215,500" fill="#F8FAFC"/>
        <polygon points="445,475 470,475 465,490 440,490" fill="#F8FAFC"/>
    </g>

    <!-- Laptop -->
    <g id="laptop">
        <!-- Base -->
        <polygon points="400,490 560,490 580,510 380,510" fill="#475569"/>
        <polygon points="380,510 580,510 580,515 380,515" fill="#1E293B"/>
        <!-- Screen Frame -->
        <polygon points="410,340 550,340 560,490 400,490" fill="#0F172A" stroke="#64748B" stroke-width="3"/>
        <!-- Screen Display -->
        <polygon points="416,348 544,348 552,482 408,482" fill="#155DFC" opacity="0.15"/>

        <!-- Screen Content (Mini Dashboard) -->
        <polygon points="425,360 535,360 537,375 423,375" fill="#155DFC" opacity="0.6"/>
        <polygon points="422,390 480,390 482,396 420,396" fill="#FFFFFF" opacity="0.4"/>
        <polygon points="419,410 500,410 502,416 417,416" fill="#FFFFFF" opacity="0.2"/>
        <!-- Mini Upward Arrow on Laptop -->
        <polygon points="510,450 530,420 540,430 525,455" fill="#155DFC"/>
    </g>

    <!-- Data Projection Lines (Connecting Laptop to Holographic UI) -->
    <g stroke="#155DFC" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6">
        <line x1="550" y1="360" x2="640" y2="160"/>
        <line x1="555" y1="420" x2="640" y2="280"/>
        <line x1="560" y1="480" x2="640" y2="400"/>
    </g>
    <!-- Projection Nodes (Diamonds) -->
    <rect x="636" y="156" width="8" height="8" fill="#155DFC" transform="rotate(45 640 160)"/>
    <rect x="636" y="276" width="8" height="8" fill="#155DFC" transform="rotate(45 640 280)"/>
    <rect x="636" y="396" width="8" height="8" fill="#155DFC" transform="rotate(45 640 400)"/>

    <!-- MAIN DIGITAL INTERFACE: PROMOTION READINESS DASHBOARD -->
    <g id="dashboard" transform="translate(640, 80)">
        <!-- Main Panel Background -->
        <rect x="0" y="0" width="500" height="320" fill="#15181C" stroke="#155DFC" stroke-width="2"/>

        <!-- Header -->
        <rect x="0" y="0" width="500" height="40" fill="#155DFC" opacity="0.1"/>
        <line x1="0" y1="40" x2="500" y2="40" stroke="#155DFC" stroke-width="2"/>
        <text x="24" y="26" fill="#FFFFFF" font-size="14" class="title">TALENT PROGRESSION ENGINE</text>
        <text x="410" y="26" fill="#155DFC" font-size="12" class="mono">SYNC</text>
        <rect x="390" y="16" width="8" height="8" fill="#155DFC" transform="rotate(45 394 20)"/>

        <!-- Geometric Star / Badge (Excellence Indicator) -->
        <g transform="translate(380, 70)">
            <!-- Outer Hexagon Shield -->
            <polygon points="40,0 80,20 80,60 40,80 0,60 0,20" fill="#155DFC" opacity="0.15" stroke="#155DFC" stroke-width="2"/>
            <polygon points="40,12 68,26 68,54 40,68 12,54 12,26" fill="#155DFC" opacity="0.3"/>
            <!-- Sharp 4-Point Tech Star -->
            <polygon points="40,20 45,35 60,40 45,45 40,60 35,45 20,40 35,35" fill="#FFFFFF"/>
        </g>

        <!-- Main Result Text -->
        <text x="30" y="105" fill="#FFFFFF" font-size="36" class="title" letter-spacing="-0.5">PROMOTION READY</text>
        <text x="30" y="130" fill="#94A3B8" font-size="13" class="label">TARGET ROLE: SENIOR DIRECTOR</text>

        <!-- Readiness Score Bar -->
        <text x="30" y="175" fill="#FFFFFF" font-size="12" class="title">READINESS SCORE</text>
        <text x="410" y="175" fill="#155DFC" font-size="18" class="mono title">94.5%</text>
        <rect x="30" y="190" width="440" height="14" fill="#252A32"/>
        <rect x="30" y="190" width="415" height="14" fill="#155DFC"/>
        <!-- Bar Segments -->
        <line x1="140" y1="190" x2="140" y2="204" stroke="#15181C" stroke-width="2"/>
        <line x1="250" y1="190" x2="250" y2="204" stroke="#15181C" stroke-width="2"/>
        <line x1="360" y1="190" x2="360" y2="204" stroke="#15181C" stroke-width="2"/>

        <!-- Skill Analysis Radar/Chart Representation (Sharp Geometric) -->
        <g transform="translate(30, 230)">
            <text x="0" y="10" fill="#64748B" font-size="10" class="mono">SKILL MATRIX ANALYSIS</text>
            <!-- Sharp Radar Chart / Polygons -->
            <polygon points="50,25 80,40 70,75 30,75 20,40" fill="none" stroke="#334155" stroke-width="2"/>
            <polygon points="50,35 70,45 60,65 40,65 30,45" fill="#155DFC" opacity="0.4" stroke="#155DFC" stroke-width="2"/>
            <rect x="48" y="23" width="4" height="4" fill="#FFFFFF" transform="rotate(45 50 25)"/>
            <rect x="78" y="38" width="4" height="4" fill="#FFFFFF" transform="rotate(45 80 40)"/>
            <rect x="68" y="73" width="4" height="4" fill="#FFFFFF" transform="rotate(45 70 75)"/>
            <rect x="28" y="73" width="4" height="4" fill="#FFFFFF" transform="rotate(45 30 75)"/>
            <rect x="18" y="38" width="4" height="4" fill="#FFFFFF" transform="rotate(45 20 40)"/>

            <!-- Data Readouts -->
            <text x="110" y="35" fill="#FFFFFF" font-size="11" class="label">LEADERSHIP</text>
            <text x="210" y="35" fill="#155DFC" font-size="12" class="mono title">EXCEEDS</text>

            <text x="110" y="55" fill="#FFFFFF" font-size="11" class="label">STRATEGY</text>
            <text x="210" y="55" fill="#155DFC" font-size="12" class="mono title">HIGH</text>

            <text x="110" y="75" fill="#FFFFFF" font-size="11" class="label">EXECUTION</text>
            <text x="210" y="75" fill="#155DFC" font-size="12" class="mono title">OPTIMAL</text>
        </g>
    </g>

    <!-- FLOATING CAREER SYMBOL CARDS (Bottom Right) -->
    <g id="career-cards" transform="translate(640, 430)">

        <!-- Card 1: Performance Chart -->
        <g transform="translate(0, 0)">
            <rect x="0" y="0" width="150" height="130" fill="#15181C" stroke="#334155" stroke-width="1.5"/>
            <rect x="0" y="0" width="150" height="4" fill="#155DFC"/>
            <!-- Chart Icon -->
            <g transform="translate(20, 25)">
                <polyline points="0,50 0,0" fill="none" stroke="#FFFFFF" stroke-width="2"/>
                <polyline points="0,50 50,50" fill="none" stroke="#FFFFFF" stroke-width="2"/>
                <polyline points="5,40 20,20 30,30 45,5" fill="none" stroke="#155DFC" stroke-width="3" stroke-linejoin="miter"/>
                <rect x="3" y="38" width="4" height="4" fill="#155DFC" transform="rotate(45 5 40)"/>
                <rect x="18" y="18" width="4" height="4" fill="#155DFC" transform="rotate(45 20 20)"/>
                <rect x="28" y="28" width="4" height="4" fill="#155DFC" transform="rotate(45 30 30)"/>
                <rect x="43" y="3" width="4" height="4" fill="#FFFFFF" transform="rotate(45 45 5)"/>
            </g>
            <text x="20" y="105" fill="#FFFFFF" font-size="12" class="label">PERFORMANCE</text>
            <text x="20" y="120" fill="#155DFC" font-size="10" class="mono">TOP 5% PEER GROUP</text>
        </g>

        <!-- Card 2: Upward Arrow (Trajectory) -->
        <g transform="translate(175, 0)">
            <rect x="0" y="0" width="150" height="130" fill="#15181C" stroke="#334155" stroke-width="1.5"/>
            <rect x="0" y="0" width="150" height="4" fill="#155DFC"/>
            <!-- Upward Arrow Icon -->
            <g transform="translate(25, 20)">
                <polygon points="25,0 50,30 35,30 35,60 15,60 15,30 0,30" fill="none" stroke="#155DFC" stroke-width="3" stroke-linejoin="miter"/>
                <polygon points="25,10 40,28 30,28 30,55 20,55 20,28 10,28" fill="#155DFC" opacity="0.3"/>
            </g>
            <text x="20" y="105" fill="#FFFFFF" font-size="12" class="label">TRAJECTORY</text>
            <text x="20" y="120" fill="#155DFC" font-size="10" class="mono">ACCELERATED PATH</text>
        </g>

        <!-- Card 3: Badge / Star (Leadership) -->
        <g transform="translate(350, 0)">
            <rect x="0" y="0" width="150" height="130" fill="#15181C" stroke="#155DFC" stroke-width="1.5"/>
            <rect x="0" y="0" width="150" height="4" fill="#155DFC"/>
            <!-- Geometric Badge Icon -->
            <g transform="translate(25, 15)">
                <!-- Ribbon Tails -->
                <polygon points="15,40 10,65 25,55 40,65 35,40" fill="#155DFC" opacity="0.5"/>
                <!-- Shield/Badge Base -->
                <polygon points="25,0 50,15 45,45 25,55 5,45 0,15" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="miter"/>
                <!-- Inner Star -->
                <polygon points="25,12 28,20 36,20 30,25 32,33 25,28 18,33 20,25 14,20 22,20" fill="#155DFC"/>
            </g>
            <text x="20" y="105" fill="#FFFFFF" font-size="12" class="label">LEADERSHIP</text>
            <text x="20" y="120" fill="#155DFC" font-size="10" class="mono">VERIFIED BADGE</text>
        </g>

    </g>

    <!-- Foreground Tech Accents / Crosshairs -->
    <g stroke="#155DFC" stroke-width="1.5" opacity="0.6">
        <!-- Top Left Crosshair -->
        <line x1="40" y1="40" x2="60" y2="40"/>
        <line x1="50" y1="30" x2="50" y2="50"/>
        <!-- Bottom Right Crosshair -->
        <line x1="1140" y1="635" x2="1160" y2="635"/>
        <line x1="1150" y1="625" x2="1150" y2="645"/>
    </g>

    <!-- Corner Framing Lines -->
    <g stroke="#FFFFFF" stroke-width="2" opacity="0.1" fill="none">
        <polyline points="20,60 20,20 60,20"/>
        <polyline points="1180,60 1180,20 1140,20"/>
        <polyline points="20,615 20,655 60,655"/>
        <polyline points="1180,615 1180,655 1140,655"/>
    </g>

    <!-- Subtle Data Stream Lines -->
    <g stroke="#FFFFFF" stroke-width="1" opacity="0.04">
        <line x1="0" y1="200" x2="1200" y2="200"/>
        <line x1="0" y1="400" x2="1200" y2="400"/>
        <line x1="620" y1="0" x2="620" y2="675"/>
    </g>

</svg>