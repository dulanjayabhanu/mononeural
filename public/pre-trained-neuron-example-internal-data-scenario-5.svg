<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" shape-rendering="crispEdges">
    <defs>
        <style>
            text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
            .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
            .title { font-weight: 800; letter-spacing: 1.5px; }
            .label { font-weight: 600; letter-spacing: 0.5px; }
        </style>
        <pattern id="dataGrid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.03"/>
            <circle cx="40" cy="40" r="1.5" fill="#155DFC" opacity="0.12"/>
        </pattern>
    </defs>

    <!-- Background -->
    <rect width="1200" height="675" fill="#1E2227"/>
    <rect width="1200" height="675" fill="url(#dataGrid)"/>

    <!-- Background Neural Network / Data Analysis Nodes -->
    <g stroke="#155DFC" stroke-width="1.5" fill="none" opacity="0.18">
        <!-- Top Left Cluster -->
        <line x1="80" y1="110" x2="160" y2="75"/>
        <line x1="160" y1="75" x2="230" y2="140"/>
        <line x1="80" y1="110" x2="145" y2="190"/>
        <line x1="145" y1="190" x2="230" y2="140"/>
        <line x1="230" y1="140" x2="310" y2="105"/>
        <line x1="160" y1="75" x2="310" y2="105"/>
        <!-- Diamond Nodes -->
        <rect x="76" y="106" width="8" height="8" fill="#155DFC" transform="rotate(45 80 110)"/>
        <rect x="156" y="71" width="8" height="8" fill="#155DFC" transform="rotate(45 160 75)"/>
        <rect x="226" y="136" width="8" height="8" fill="#155DFC" transform="rotate(45 230 140)"/>
        <rect x="141" y="186" width="8" height="8" fill="#155DFC" transform="rotate(45 145 190)"/>
        <rect x="306" y="101" width="8" height="8" fill="#155DFC" transform="rotate(45 310 105)"/>

        <!-- Bottom Right Cluster -->
        <line x1="940" y1="570" x2="1010" y2="535"/>
        <line x1="1010" y1="535" x2="1090" y2="585"/>
        <line x1="1010" y1="535" x2="1070" y2="475"/>
        <line x1="1070" y1="475" x2="1090" y2="585"/>
        <rect x="936" y="566" width="8" height="8" fill="#155DFC" transform="rotate(45 940 570)"/>
        <rect x="1006" y="531" width="8" height="8" fill="#155DFC" transform="rotate(45 1010 535)"/>
        <rect x="1086" y="581" width="8" height="8" fill="#155DFC" transform="rotate(45 1090 585)"/>
        <rect x="1066" y="471" width="8" height="8" fill="#155DFC" transform="rotate(45 1070 475)"/>
    </g>

    <!-- Abstract Analytics Background Shapes -->
    <g stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.02">
        <polygon points="1060,140 1110,110 1160,140 1160,200 1110,230 1060,200"/>
        <rect x="80" y="440" width="80" height="80" transform="rotate(45 120 480)"/>
    </g>

    <!-- Environment: Desk -->
    <polygon points="60,515 640,515 680,545 20,545" fill="#252A32"/>
    <rect x="20" y="545" width="660" height="12" fill="#1A1E24"/>
    <rect x="100" y="557" width="16" height="118" fill="#15181C"/>
    <rect x="580" y="557" width="16" height="118" fill="#15181C"/>

    <!-- Business Analyst (Sharp Geometric Vector Style) -->
    <g id="analyst">
        <!-- Chair -->
        <polygon points="170,350 225,350 245,515 145,515" fill="#15181C" stroke="#252A32" stroke-width="2"/>
        <rect x="145" y="515" width="100" height="8" fill="#1E2227"/>

        <!-- Legs -->
        <polygon points="250,515 285,515 305,675 255,675" fill="#0F172A"/>
        <polygon points="295,515 330,515 360,675 310,675" fill="#1E293B"/>

        <!-- Torso / Business Attire -->
        <polygon points="215,515 255,340 355,340 385,515" fill="#E2E8F0"/>
        <!-- Shirt & Professional Details -->
        <polygon points="255,340 305,425 355,340" fill="#F8FAFC"/>
        <polygon points="295,340 305,405 315,340" fill="#1E293B"/> <!-- Tie -->
        <!-- Suit Jacket -->
        <polygon points="255,340 285,445 215,515 235,405" fill="#334155"/>
        <polygon points="355,340 325,445 385,515 375,405" fill="#334155"/>

        <!-- Neck & Head -->
        <rect x="290" y="300" width="24" height="40" fill="#E2E8F0"/>
        <!-- Face (Professional, focused on screen) -->
        <polygon points="275,240 335,240 350,285 315,315 270,300" fill="#F8FAFC"/>
        <!-- Hair (Professional Style) -->
        <polygon points="265,250 280,215 330,210 355,245 340,260 285,255" fill="#0F172A"/>

        <!-- Left Arm (Holding tablet/notepad) -->
        <polygon points="245,350 200,450 180,480 210,490 240,460 270,360" fill="#CBD5E1"/>
        <!-- Tablet/Notepad in hand -->
        <rect x="165" y="465" width="35" height="50" fill="#334155" stroke="#155DFC" stroke-width="2"/>
        <rect x="170" y="470" width="25" height="3" fill="#155DFC"/>
        <rect x="170" y="478" width="20" height="2" fill="#FFFFFF" opacity="0.3"/>
        <rect x="170" y="485" width="22" height="2" fill="#FFFFFF" opacity="0.2"/>

        <!-- Right Arm (Interacting with laptop) -->
        <polygon points="345,350 415,435 465,485 450,500 395,450 325,365" fill="#E2E8F0"/>

        <!-- Hands -->
        <polygon points="175" y="460" width="30" height="20" fill="#F8FAFC"/>
        <polygon points="450,480 475,480 470,495 445,495" fill="#F8FAFC"/>
    </g>

    <!-- Laptop -->
    <g id="laptop">
        <!-- Base -->
        <polygon points="405,485 570,485 590,505 385,505" fill="#475569"/>
        <polygon points="385,505 590,505 590,510 385,510" fill="#1E293B"/>
        <!-- Screen Frame -->
        <polygon points="415,345 560,345 570,485 405,485" fill="#0F172A" stroke="#64748B" stroke-width="3"/>
        <!-- Screen Display -->
        <polygon points="421,353 554,353 562,477 413,477" fill="#155DFC" opacity="0.12"/>

        <!-- Screen Content (Churn Dashboard Preview) -->
        <polygon points="430,365 545,365 547,380 428,380" fill="#155DFC" opacity="0.6"/>
        <!-- Warning Indicator on Laptop -->
        <g transform="translate(435, 395)">
            <polygon points="10,0 20,17 0,17" fill="none" stroke="#FF4444" stroke-width="2"/>
            <line x1="10" y1="6" x2="10" y2="12" stroke="#FF4444" stroke-width="2"/>
            <rect x="9" y="14" width="2" height="2" fill="#FF4444"/>
        </g>
        <text x="460" y="415" fill="#FF4444" font-size="9" class="label">HIGH RISK</text>
        <!-- Mini Chart -->
        <polyline points="430,445 455,465 480,450 510,455 530,440" fill="none" stroke="#155DFC" stroke-width="2"/>
    </g>

    <!-- Data Projection Lines (Connecting Laptop to Dashboard) -->
    <g stroke="#155DFC" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6">
        <line x1="560" y1="365" x2="650" y2="165"/>
        <line x1="565" y1="425" x2="650" y2="285"/>
        <line x1="570" y1="485" x2="650" y2="405"/>
    </g>
    <!-- Projection Nodes -->
    <rect x="646" y="161" width="8" height="8" fill="#155DFC" transform="rotate(45 650 165)"/>
    <rect x="646" y="281" width="8" height="8" fill="#155DFC" transform="rotate(45 650 285)"/>
    <rect x="646" y="401" width="8" height="8" fill="#155DFC" transform="rotate(45 650 405)"/>

    <!-- MAIN DIGITAL INTERFACE: CUSTOMER CHURN PREDICTION DASHBOARD -->
    <g id="dashboard" transform="translate(650, 70)">
        <!-- Main Panel Background -->
        <rect x="0" y="0" width="510" height="340" fill="#15181C" stroke="#155DFC" stroke-width="2"/>

        <!-- Header -->
        <rect x="0" y="0" width="510" height="42" fill="#155DFC" opacity="0.1"/>
        <line x1="0" y1="42" x2="510" y2="42" stroke="#155DFC" stroke-width="2"/>
        <text x="24" y="27" fill="#FFFFFF" font-size="14" class="title">CUSTOMER CHURN ANALYTICS</text>
        <!-- Status Indicator -->
        <circle cx="465" cy="21" r="5" fill="#FF4444"/>
        <text x="420" y="27" fill="#FF4444" font-size="11" class="mono">ALERT</text>

        <!-- Warning / Risk Indicator Badge -->
        <g transform="translate(390, 65)">
            <polygon points="40,0 80,20 80,60 40,80 0,60 0,20" fill="#FF4444" opacity="0.15" stroke="#FF4444" stroke-width="2"/>
            <polygon points="40,15 68,28 68,52 40,65 12,52 12,28" fill="#FF4444" opacity="0.25"/>
            <!-- Warning Triangle -->
            <polygon points="40,25 50,45 30,45" fill="none" stroke="#FFFFFF" stroke-width="3"/>
            <line x1="40" y1="32" x2="40" y2="38" stroke="#FFFFFF" stroke-width="2"/>
            <rect x="39" y="41" width="2" height="2" fill="#FFFFFF"/>
        </g>

        <!-- Main Result Text -->
        <text x="30" y="105" fill="#FFFFFF" font-size="38" class="title" letter-spacing="-0.5">HIGH CHURN RISK</text>
        <text x="30" y="130" fill="#FF9999" font-size="13" class="label">SEGMENT: PREMIUM TIER CUSTOMERS</text>

        <!-- Risk Probability Bar -->
        <text x="30" y="175" fill="#FFFFFF" font-size="12" class="title">CHURN PROBABILITY</text>
        <text x="420" y="175" fill="#FF4444" font-size="18" class="mono title">87.3%</text>
        <rect x="30" y="190" width="450" height="14" fill="#252A32"/>
        <rect x="30" y="190" width="393" height="14" fill="#FF4444"/>
        <!-- Bar Segments -->
        <line x1="142" y1="190" x2="142" y2="204" stroke="#15181C" stroke-width="2"/>
        <line x1="255" y1="190" x2="255" y2="204" stroke="#15181C" stroke-width="2"/>
        <line x1="368" y1="190" x2="368" y2="204" stroke="#15181C" stroke-width="2"/>

        <!-- Predictive Insights Section -->
        <text x="30" y="235" fill="#64748B" font-size="10" class="mono">PREDICTIVE FACTORS ANALYSIS</text>

        <!-- Factor Bars (Mini Analytics) -->
        <g transform="translate(30, 245)">
            <text x="0" y="12" fill="#FFFFFF" font-size="10" class="label">Usage Decline</text>
            <rect x="150" y="3" width="200" height="8" fill="#252A32"/>
            <rect x="150" y="3" width="180" height="8" fill="#155DFC"/>
            <text x="360" y="12" fill="#155DFC" font-size="10" class="mono">92%</text>

            <text x="0" y="32" fill="#FFFFFF" font-size="10" class="label">Support Tickets</text>
            <rect x="150" y="23" width="200" height="8" fill="#252A32"/>
            <rect x="150" y="23" width="165" height="8" fill="#155DFC"/>
            <text x="360" y="32" fill="#155DFC" font-size="10" class="mono">78%</text>

            <text x="0" y="52" fill="#FFFFFF" font-size="10" class="label">Payment Issues</text>
            <rect x="150" y="43" width="200" height="8" fill="#252A32"/>
            <rect x="150" y="43" width="145" height="8" fill="#FF4444"/>
            <text x="360" y="52" fill="#FF4444" font-size="10" class="mono">65%</text>
        </g>
    </g>

    <!-- BUSINESS SYMBOL CARDS (Bottom Section) -->
    <g id="business-cards" transform="translate(650, 440)">

        <!-- Card 1: Customer Profile Icon -->
        <g transform="translate(0, 0)">
            <rect x="0" y="0" width="155" height="135" fill="#15181C" stroke="#334155" stroke-width="1.5"/>
            <rect x="0" y="0" width="155" height="4" fill="#155DFC"/>
            <!-- Customer Profile Icon -->
            <g transform="translate(30, 20)">
                <!-- Head -->
                <circle cx="25" cy="18" r="12" fill="none" stroke="#FFFFFF" stroke-width="2"/>
                <!-- Body -->
                <path d="M 8 55 Q 8 38 25 38 Q 42 38 42 55" fill="none" stroke="#FFFFFF" stroke-width="2"/>
                <!-- Indicator Dot -->
                <circle cx="40" cy="15" r="4" fill="#FF4444"/>
            </g>
            <text x="20" y="105" fill="#FFFFFF" font-size="12" class="label">AT-RISK COHORT</text>
            <text x="20" y="122" fill="#FF4444" font-size="11" class="mono">2,847 CUSTOMERS</text>
        </g>

        <!-- Card 2: Retention Chart -->
        <g transform="translate(177, 0)">
            <rect x="0" y="0" width="155" height="135" fill="#15181C" stroke="#334155" stroke-width="1.5"/>
            <rect x="0" y="0" width="155" height="4" fill="#155DFC"/>
            <!-- Retention Chart Icon -->
            <g transform="translate(25, 20)">
                <!-- Axes -->
                <polyline points="0,55 0,0" fill="none" stroke="#FFFFFF" stroke-width="2"/>
                <polyline points="0,55 55,55" fill="none" stroke="#FFFFFF" stroke-width="2"/>
                <!-- Declining Line -->
                <polyline points="5,10 20,15 35,30 50,50" fill="none" stroke="#FF4444" stroke-width="3" stroke-linejoin="miter"/>
                <rect x="3" y="8" width="4" height="4" fill="#FF4444" transform="rotate(45 5 10)"/>
                <rect x="18" y="13" width="4" height="4" fill="#FF4444" transform="rotate(45 20 15)"/>
                <rect x="33" y="28" width="4" height="4" fill="#FF4444" transform="rotate(45 35 30)"/>
                <rect x="48" y="48" width="4" height="4" fill="#FF4444" transform="rotate(45 50 50)"/>
            </g>
            <text x="20" y="105" fill="#FFFFFF" font-size="12" class="label">RETENTION RATE</text>
            <text x="20" y="122" fill="#FF4444" font-size="11" class="mono">-23% TREND</text>
        </g>

        <!-- Card 3: Analytics Graph -->
        <g transform="translate(354, 0)">
            <rect x="0" y="0" width="156" height="135" fill="#15181C" stroke="#155DFC" stroke-width="1.5"/>
            <rect x="0" y="0" width="156" height="4" fill="#155DFC"/>
            <!-- Analytics Graph Icon -->
            <g transform="translate(25, 20)">
                <!-- Bar Chart -->
                <rect x="5" y="35" width="10" height="20" fill="#155DFC"/>
                <rect x="20" y="25" width="10" height="30" fill="#155DFC"/>
                <rect x="35" y="30" width="10" height="25" fill="#FF4444"/>
                <rect x="50" y="40" width="10" height="15" fill="#FF4444"/>
                <!-- Trend Line Overlay -->
                <polyline points="10,40 25,30 40,35 55,45" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2"/>
            </g>
            <text x="20" y="105" fill="#FFFFFF" font-size="12" class="label">PREDICTIVE MODEL</text>
            <text x="20" y="122" fill="#155DFC" font-size="11" class="mono">ACCURACY: 94.2%</text>
        </g>

    </g>

    <!-- Foreground Tech Accents / Crosshairs -->
    <g stroke="#155DFC" stroke-width="1.5" opacity="0.6">
        <!-- Top Left Crosshair -->
        <line x1="40" y1="40" x2="60" y2="40"/>
        <line x1="50" y1="30" x2="50" y2="50"/>
        <!-- Bottom Right Crosshair -->
        <line x1="1140" y1="635" x2="1160" y2="635"/>
        <line x1="1150" y1="625" x2="1150" y2="645"/>
    </g>

    <!-- Corner Framing Lines -->
    <g stroke="#FFFFFF" stroke-width="2" opacity="0.1" fill="none">
        <polyline points="20,60 20,20 60,20"/>
        <polyline points="1180,60 1180,20 1140,20"/>
        <polyline points="20,615 20,655 60,655"/>
        <polyline points="1180,615 1180,655 1140,655"/>
    </g>

    <!-- Subtle Data Stream Lines -->
    <g stroke="#FFFFFF" stroke-width="1" opacity="0.04">
        <line x1="0" y1="200" x2="1200" y2="200"/>
        <line x1="0" y1="400" x2="1200" y2="400"/>
        <line x1="640" y1="0" x2="640" y2="675"/>
    </g>

    <!-- Warning Indicators (Floating) -->
    <g opacity="0.3">
        <polygon points="350,180 360,200 340,200" fill="none" stroke="#FF4444" stroke-width="2"/>
        <polygon points="1020,350 1030,370 1010,370" fill="none" stroke="#FF4444" stroke-width="2"/>
    </g>

</svg>