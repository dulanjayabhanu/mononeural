<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" shape-rendering="crispEdges">
    <defs>
        <style>
            text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
            .title { font-weight: 700; letter-spacing: 1.5px; }
            .data { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
        </style>
        <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.03"/>
            <rect x="38" y="38" width="2" height="2" fill="#155DFC" opacity="0.1"/>
        </pattern>
    </defs>

    <!-- Background -->
    <rect width="1200" height="675" fill="#1E2227"/>
    <rect width="1200" height="675" fill="url(#techGrid)"/>

    <!-- Background Geometric & Neural Network Elements -->
    <g stroke="#155DFC" stroke-width="1.5" fill="none" opacity="0.15">
        <!-- Top Left Neural Net -->
        <line x1="80" y1="120" x2="160" y2="80"/>
        <line x1="160" y1="80" x2="240" y2="140"/>
        <line x1="80" y1="120" x2="140" y2="200"/>
        <line x1="140" y1="200" x2="240" y2="140"/>
        <polygon points="80,115 85,120 80,125 75,120" fill="#155DFC"/>
        <polygon points="160,75 165,80 160,85 155,80" fill="#155DFC"/>
        <polygon points="240,135 245,140 240,145 235,140" fill="#155DFC"/>
        <polygon points="140,195 145,200 140,205 135,200" fill="#155DFC"/>

        <!-- Bottom Right Data Graph -->
        <polyline points="950,600 1000,550 1050,570 1120,480" stroke-width="2"/>
        <rect x="947" y="597" width="6" height="6" fill="#155DFC"/>
        <rect x="997" y="547" width="6" height="6" fill="#155DFC"/>
        <rect x="1047" y="567" width="6" height="6" fill="#155DFC"/>
        <rect x="1117" y="477" width="6" height="6" fill="#155DFC"/>
    </g>

    <!-- Large Background Hexagons -->
    <g stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.02">
        <polygon points="1050,150 1100,120 1150,150 1150,210 1100,240 1050,210"/>
        <polygon points="100,450 150,420 200,450 200,510 150,540 100,510"/>
    </g>

    <!-- Environment: Desk -->
    <polygon points="120,480 580,480 620,510 80,510" fill="#252A32"/>
    <rect x="80" y="510" width="540" height="8" fill="#1A1E24"/>
    <rect x="140" y="518" width="16" height="157" fill="#1C2129"/>
    <rect x="540" y="518" width="16" height="157" fill="#1C2129"/>

    <!-- Student (Minimalist Geometric Vector Style) -->
    <g id="student">
        <!-- Legs -->
        <polygon points="260,480 290,480 310,675 270,675" fill="#1E293B"/>
        <polygon points="310,480 340,480 360,675 320,675" fill="#0F172A"/>

        <!-- Torso -->
        <polygon points="230,480 260,320 340,320 360,480" fill="#F8FAFC"/>
        <polygon points="260,320 300,380 340,320" fill="#E2E8F0"/> <!-- Shirt fold/shadow -->

        <!-- Neck & Head -->
        <rect x="285" y="290" width="24" height="30" fill="#E2E8F0"/>
        <!-- Face (Profile/Angled) -->
        <polygon points="270,230 330,230 340,270 310,300 270,290" fill="#F1F5F9"/>
        <!-- Hair -->
        <polygon points="260,240 270,210 320,200 345,230 330,245 280,245" fill="#0F172A"/>

        <!-- Left Arm (Resting on desk) -->
        <polygon points="250,330 210,420 240,470 260,460 235,415 270,340" fill="#E2E8F0"/>
        <!-- Right Arm (Typing/Interacting) -->
        <polygon points="330,330 390,410 440,450 430,465 375,425 315,350" fill="#CBD5E1"/>

        <!-- Hands -->
        <polygon points="230,465 255,465 250,480 225,480" fill="#F1F5F9"/>
        <polygon points="430,445 455,445 450,460 425,460" fill="#E2E8F0"/>
    </g>

    <!-- Laptop -->
    <g id="laptop">
        <!-- Base -->
        <polygon points="380,465 520,465 540,480 360,480" fill="#334155"/>
        <polygon points="360,480 540,480 540,484 360,484" fill="#1E293B"/>
        <!-- Screen Back/Frame -->
        <polygon points="390,330 510,330 520,465 380,465" fill="#0F172A" stroke="#475569" stroke-width="4"/>
        <!-- Screen Display -->
        <polygon points="396,338 504,338 512,457 388,457" fill="#155DFC" opacity="0.15"/>
        <!-- Screen Content (Mini UI) -->
        <polygon points="405,350 495,350 497,360 403,360" fill="#155DFC" opacity="0.6"/>
        <polygon points="402,370 460,370 462,376 400,376" fill="#FFFFFF" opacity="0.4"/>
        <polygon points="399,385 480,385 482,391 397,391" fill="#FFFFFF" opacity="0.2"/>
    </g>

    <!-- Digital Projection / Connection Lines -->
    <g stroke="#155DFC" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4">
        <line x1="510" y1="350" x2="600" y2="180"/>
        <line x1="515" y1="400" x2="600" y2="320"/>
        <line x1="520" y1="450" x2="600" y2="480"/>
    </g>
    <!-- Connection Nodes -->
    <rect x="596" y="176" width="8" height="8" fill="#155DFC"/>
    <rect x="596" y="316" width="8" height="8" fill="#155DFC"/>
    <rect x="596" y="476" width="8" height="8" fill="#155DFC"/>

    <!-- MAIN DIGITAL PREDICTION INTERFACE -->
    <g id="main-ui" transform="translate(600, 100)">
        <!-- Main Panel Background -->
        <rect x="0" y="0" width="520" height="280" fill="#1A1E24" stroke="#155DFC" stroke-width="2"/>

        <!-- Panel Header -->
        <rect x="0" y="0" width="520" height="40" fill="#155DFC" opacity="0.1"/>
        <line x1="0" y1="40" x2="520" y2="40" stroke="#155DFC" stroke-width="2"/>
        <text x="24" y="26" fill="#FFFFFF" font-size="14" class="title">UNIVERSITY ADMISSION PREDICTION</text>

        <!-- Status Badge / Shield -->
        <g transform="translate(380, 60)">
            <polygon points="50,0 100,20 100,70 50,100 0,70 0,20" fill="#155DFC" opacity="0.15" stroke="#155DFC" stroke-width="2"/>
            <polygon points="50,15 85,30 85,65 50,85 15,65 15,30" fill="#155DFC" opacity="0.3"/>
            <!-- Sharp Checkmark inside shield -->
            <polyline points="35,50 45,60 65,35" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="miter"/>
        </g>

        <!-- Main Result Text -->
        <text x="40" y="110" fill="#FFFFFF" font-size="48" font-weight="800" letter-spacing="-1">ADMITTED</text>
        <text x="40" y="140" fill="#94A3B8" font-size="14" font-weight="500" letter-spacing="0.5">ELIGIBILITY STATUS CONFIRMED</text>

        <!-- Prediction Probability Bar -->
        <text x="40" y="190" fill="#FFFFFF" font-size="12" class="title">PREDICTION CONFIDENCE</text>
        <text x="430" y="190" fill="#155DFC" font-size="16" font-weight="700" class="data">98.4%</text>
        <rect x="40" y="205" width="440" height="12" fill="#252A32"/>
        <rect x="40" y="205" width="433" height="12" fill="#155DFC"/>
        <!-- Bar segments -->
        <line x1="150" y1="205" x2="150" y2="217" stroke="#1A1E24" stroke-width="2"/>
        <line x1="260" y1="205" x2="260" y2="217" stroke="#1A1E24" stroke-width="2"/>
        <line x1="370" y1="205" x2="370" y2="217" stroke="#1A1E24" stroke-width="2"/>

        <!-- Data Points -->
        <text x="40" y="250" fill="#64748B" font-size="11" class="data">MODEL: v4.2.0</text>
        <text x="160" y="250" fill="#64748B" font-size="11" class="data">DATASET: 2024_ADM</text>
        <text x="320" y="250" fill="#64748B" font-size="11" class="data">ACCURACY: 99.1%</text>
    </g>

    <!-- ACADEMIC SYMBOL CARDS (Floating below main UI) -->
    <g id="academic-cards" transform="translate(600, 410)">

        <!-- Card 1: Graduation Cap -->
        <g transform="translate(0, 0)">
            <rect x="0" y="0" width="160" height="150" fill="#1A1E24" stroke="#334155" stroke-width="1.5"/>
            <rect x="0" y="0" width="160" height="4" fill="#155DFC"/>
            <!-- Cap Icon -->
            <g transform="translate(40, 30)">
                <polygon points="40,10 80,30 40,50 0,30" fill="none" stroke="#155DFC" stroke-width="3" stroke-linejoin="miter"/>
                <polygon points="20,40 20,60 40,70 60,60 60,40" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="miter"/>
                <line x1="80" y1="30" x2="80" y2="65" stroke="#155DFC" stroke-width="2"/>
                <polygon points="76,65 84,65 80,75" fill="#155DFC"/>
            </g>
            <text x="80" y="125" fill="#FFFFFF" font-size="12" class="title" text-anchor="middle">DEGREE TRACK</text>
        </g>

        <!-- Card 2: Diploma -->
        <g transform="translate(180, 0)">
            <rect x="0" y="0" width="160" height="150" fill="#1A1E24" stroke="#334155" stroke-width="1.5"/>
            <rect x="0" y="0" width="160" height="4" fill="#155DFC"/>
            <!-- Diploma Icon -->
            <g transform="translate(40, 30)">
                <polygon points="15,20 65,20 65,70 15,70" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="miter"/>
                <polygon points="15,20 30,20 15,35" fill="#FFFFFF" opacity="0.3"/>
                <line x1="25" y1="40" x2="55" y2="40" stroke="#64748B" stroke-width="2"/>
                <line x1="25" y1="50" x2="45" y2="50" stroke="#64748B" stroke-width="2"/>
                <!-- Ribbon -->
                <polygon points="55,55 65,55 65,80 60,75 55,80" fill="#155DFC"/>
                <circle cx="60" cy="55" r="8" fill="#1A1E24" stroke="#155DFC" stroke-width="2"/>
            </g>
            <text x="80" y="125" fill="#FFFFFF" font-size="12" class="title" text-anchor="middle">CREDENTIALS</text>
        </g>

        <!-- Card 3: Document Checkmark -->
        <g transform="translate(360, 0)">
            <rect x="0" y="0" width="160" height="150" fill="#1A1E24" stroke="#155DFC" stroke-width="1.5"/>
            <rect x="0" y="0" width="160" height="4" fill="#155DFC"/>
            <!-- Document Check Icon -->
            <g transform="translate(40, 25)">
                <polygon points="10,10 50,10 70,30 70,80 10,80" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="miter"/>
                <polygon points="50,10 50,30 70,30" fill="#FFFFFF" opacity="0.2"/>
                <line x1="20" y1="40" x2="40" y2="40" stroke="#64748B" stroke-width="2"/>
                <line x1="20" y1="50" x2="60" y2="50" stroke="#64748B" stroke-width="2"/>
                <!-- Large Checkmark -->
                <polyline points="30,65 40,75 60,50" fill="none" stroke="#155DFC" stroke-width="4" stroke-linejoin="miter"/>
            </g>
            <text x="80" y="125" fill="#155DFC" font-size="12" class="title" text-anchor="middle">VERIFIED</text>
        </g>

    </g>

    <!-- Foreground Tech Accents / Crosshairs -->
    <g stroke="#155DFC" stroke-width="1" opacity="0.5">
        <!-- Top Left Crosshair -->
        <line x1="40" y1="40" x2="60" y2="40"/>
        <line x1="50" y1="30" x2="50" y2="50"/>
        <!-- Bottom Right Crosshair -->
        <line x1="1140" y1="635" x2="1160" y2="635"/>
        <line x1="1150" y1="625" x2="1150" y2="645"/>
    </g>

    <!-- Corner Framing Lines -->
    <g stroke="#FFFFFF" stroke-width="2" opacity="0.1">
        <polyline points="20,60 20,20 60,20" fill="none"/>
        <polyline points="1180,60 1180,20 1140,20" fill="none"/>
        <polyline points="20,615 20,655 60,655" fill="none"/>
        <polyline points="1180,615 1180,655 1140,655" fill="none"/>
    </g>

</svg>